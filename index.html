  <style>
    :root {
      --bg: #edeced;
      --card: #ffffff;
      --text: #2f2a24;
      --muted: #7a6f66;
      --accent: #8c6a4a;
      --accent-soft: #efe3d5;
      --border: #e7ddd2;
      --shadow: 0 10px 30px rgba(85, 63, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Glacial Indifference', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .names-header {
      font-family: 'Glacial Indifference', Arial, sans-serif;
      font-size: 3.4rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: #000000;
      margin-bottom: 4px;
    }

    .date {
      font-family: 'Glacial Indifference', Arial, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #000000;
    }

    .tagline {
      font-family: 'Glacial Indifference', Arial, sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #000000;
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      text-align: left;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-family: 'Glacial Indifference', Arial, sans-serif;
    }

    .search-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      font-family: 'Glacial Indifference', Arial, sans-serif;
      background: #ffffff;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(140, 106, 74, 0.12);
    }

    .results {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s ease;
      font-family: 'Glacial Indifference', Arial, sans-serif;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: var(--accent-soft);
    }

    .helper {
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--muted);
      font-family: 'Glacial Indifference', Arial, sans-serif;
    }

    @media (max-width: 640px) {
      .card { padding: 22px; }
      .names-header { font-size: 2.6rem; }
      .tagline { font-size: 1rem; }
      h1 { font-size: 1.1rem; }
    }
  </style>
</head>

    const searchInput = document.getElementById('guestSearch');
    const resultsBox = document.getElementById('results');

    function renderResults(matches) {
      if (!matches.length) {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        return;
      }

      resultsBox.innerHTML = matches.map(guest => `
        <div class="result-item" data-link="${guest.link}">${guest.name}</div>
      `).join('');
      resultsBox.style.display = 'block';

      document.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => {
          window.location.href = item.dataset.link;
        });
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();

      if (!query) {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        return;
      }

      const matches = guests.filter(guest =>
        guest.name.toLowerCase().includes(query)
      ).slice(0, 8);

      renderResults(matches);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) {
        resultsBox.style.display = 'none';
      }
    });
