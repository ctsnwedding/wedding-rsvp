<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding RSVP Search</title>
  <style>
    :root {
      --bg: #edeced;
      --card: #ffffff;
      --text: #000000;
      --muted: #7a6f66;
      --accent: #8c6a4a;
      --accent-soft: #efe3d5;
      --border: #e7ddd2;
      --shadow: 0 10px 30px rgba(85, 63, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      text-align: center;
    }

    .header-names {
      font-family: "Brown Sugar", "Times New Roman", serif; /* fallback */
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: #000000;
    }

    .header-date {
      font-family: "Glacial Indifference", Arial, sans-serif; /* fallback */
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #000000;
    }

    .header-join {
      font-family: "Glacial Indifference", Arial, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 26px;
      color: #000000;
    }

    .search-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
      color: #000000;
    }

    .search-wrap {
      position: relative;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(140, 106, 74, 0.12);
    }

    .results {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: var(--accent-soft);
    }

    .helper {
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: left;
    }

    @media (max-width: 640px) {
      .card { padding: 22px; }
      .header-names { font-size: 1.4rem; }
      .header-join { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header-names">Susan &amp; Cody</div>
    <div class="header-date">09.05.2026</div>
    <div class="header-join">JOIN US IN CELEBRATION</div>

    <div class="search-title">FIND YOUR NAME</div>

    <div class="search-wrap">
      <input
        type="text"
        id="guestSearch"
        placeholder="Enter
