<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding RSVP Search</title>
  <style>
    :root {
      --bg: #edeced;
      --card: #ffffff;
      --text: #2f2a24;
      --muted: #7a6f66;
      --accent: #8c6a4a;
      --accent-soft: #efe3d5;
      --border: #e7ddd2;
      --shadow: 0 10px 30px rgba(85, 63, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* “Susan & Cody” — Brown Sugar style placeholder */
    .names-header {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #000000;
    }

    /* “09.05.2026” — Glacial Indifference style placeholder */
    .date {
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #000000;
    }

    /* “JOIN US IN CELEBRATION” */
    .tagline {
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #000000;
    }

    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      text-align: left;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      line-height: 1.2;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .search-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 16px 18px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(140, 106, 74, 0.12);
    }

    .results {
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: none;
    }

    .result-item {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item:hover {
      background: var(--accent-soft);
    }

    .helper {
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .card { padding: 22px; }
      .names-header { font-size: 1.3rem; }
      .tagline { font-size: 1rem; }
